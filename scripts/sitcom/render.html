<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(fonts/fredoka.woff2) format("woff2"); font-weight: 300 700; }
@font-face { font-family: Hand; src: url(fonts/patrick.woff2) format("woff2"); }
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W = 1280, H = 720, SCALE = 1, GROUND = 655;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let TL = null;

// ---------- utils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0 ? 0 : k > 1 ? 1 : 1 - Math.pow(1 - k, 3);
const back = k => { k = clamp(k, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function fillC(c) { ctx.fillStyle = c; ctx.fill(); }
function strokeC(c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
function text(s, x, y, size, color, opts = {}) {
  ctx.font = `${opts.weight || 700} ${size}px ${opts.font || 'Fredoka'}`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = opts.base || 'middle';
  if (opts.stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = opts.stroke; ctx.lineWidth = opts.sw || size * 0.18; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size, font = 'Fredoka', weight = 600) {
  ctx.font = `${weight} ${size}px ${font}`;
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const tr = cur ? cur + ' ' + w : w; if (ctx.measureText(tr).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tr; }
  if (cur) lines.push(cur); return lines;
}

// ---------- characters ----------
const CH = {
  tara:    { name: 'TARA', color: '#a78bfa', skin: '#b67c55', hair: '#1c1310', top: '#7c5cff', top2: '#6246ea', legs: '#2f3a6b', h: 0.9, glasses: 'round', hairStyle: 'pony' },
  mum:     { name: 'MUM', color: '#2dd4bf', skin: '#c48c62', hair: '#21140f', top: '#0fa596', top2: '#0b8a7d', legs: '#ead7b7', h: 0.96, hairStyle: 'bun', earrings: true, long: true },
  dad:     { name: 'DAD', color: '#fbbf24', skin: '#a87150', hair: '#2a211d', top: '#f59e0b', top2: '#d97f06', legs: '#7a6a55', h: 1.04, glasses: 'rect', hairStyle: 'short', mo: true, belly: true },
  guide:   { name: 'MUSEUM GUIDE', color: '#a3e635', skin: '#e2b48d', hair: '#3b2a20', top: '#4d7c0f', top2: '#365314', legs: '#33334d', h: 1.0, hairStyle: 'short' },
  ticktock: { name: 'TICKTOCK', color: '#fdba74', monster: true, h: 1.0 },
  narrator: { name: 'NARRATOR', color: '#cbd5e1', skin: '#d6a074', hair: '#333', top: '#475569', top2: '#334155', legs: '#1f2937', h: 1.0, hairStyle: 'short' },
  teacher: { name: 'MS LIM', color: '#f472b6', skin: '#dcae86', hair: '#2b1d14', top: '#ec4899', top2: '#be185d', legs: '#334155', h: 0.98, glasses: 'rect', hairStyle: 'bob', long: true },
  uncle:   { name: 'UNCLE HOCK', color: '#60a5fa', skin: '#d6a074', hair: '#9ca3af', top: '#f1f5f9', top2: '#cbd5e1', legs: '#1f2937', h: 1.0, hairStyle: 'short', belly: true, apron: '#2563eb' },
};

function blinkAt(t, seed) {
  const period = 2.6 + hash(seed) * 2.2; const ph = (t + hash(seed + 3) * 5) % period; return ph < 0.12;
}

function brows(mood) {
  // returns [innerYoffset, outerYoffset] per brow; positive = down
  return { neutral: [0, 0], happy: [-2, -1], excited: [-6, -3], deadpan: [3, 3], annoyed: [5, -2], shock: [-9, -7], smug: [2, -4],
    thinking: [-3, 2], worried: [-5, 3], sad: [-5, 4], determined: [5, -1], teach: [-2, -2], bored: [4, 4], eyeroll: [2, 2],
    flustered: [-7, 2], solemn: [-3, 3] }[mood] || [0, 0];
}

function drawHuman(id, x, st) {
  const c = CH[id], s = c.h, t = st.t;
  const talk = st.mouth || 0;
  const bob = Math.sin(t * 1.7 + x) * 1.5 + (st.talking ? Math.sin(t * 9) * talk * 2.5 : 0);
  ctx.save(); ctx.translate(x, GROUND); ctx.scale(s, s);
  // shadow
  ell(0, 2, 70, 12); fillC('rgba(0,0,0,0.18)');
  // legs
  ctx.fillStyle = c.legs;
  if (c.long) { rr(-46, -150, 92, 150, 14); ctx.fill(); }
  else { rr(-38, -150, 32, 150, 12); ctx.fill(); rr(6, -150, 32, 150, 12); ctx.fill(); }
  ctx.fillStyle = '#2a2a33'; rr(-44, -14, 42, 16, 8); ctx.fill(); rr(2, -14, 42, 16, 8); ctx.fill();
  ctx.translate(0, bob);
  // torso
  const bw = c.belly ? 64 : 54;
  ctx.fillStyle = c.top; rr(-bw, -300, bw * 2, 170, 40); ctx.fill();
  if (c.long) { ctx.fillStyle = c.top; rr(-58, -170, 116, 95, 20); ctx.fill(); ctx.fillStyle = c.top2; rr(-58, -100, 116, 10, 4); ctx.fill(); }
  if (id === 'tara') { ctx.fillStyle = c.top2; rr(-30, -215, 60, 40, 10); ctx.fill(); strokeC('#ffffff55', 2); text('?', 0, -195, 28, '#fff'); }
  if (id === 'dad') { ctx.fillStyle = c.top2; ctx.beginPath(); ctx.moveTo(-20, -300); ctx.lineTo(0, -262); ctx.lineTo(20, -300); ctx.fill(); }
  if (id === 'guide') { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-26, -298); ctx.lineTo(0, -240); ctx.lineTo(26, -298); ctx.stroke(); ctx.fillStyle = '#fff'; rr(-18, -244, 36, 26, 4); ctx.fill(); text('GUIDE', 0, -231, 9, '#365314'); }
  if (st.wear === 'sash') { ctx.save(); ctx.beginPath(); ctx.rect(-bw, -300, bw * 2, 170); ctx.clip(); ctx.translate(0, -215); ctx.rotate(-0.85);
    [['#7e22ce', -21], ['#f8fafc', -7], ['#16a34a', 7]].forEach(([col, o]) => { ctx.fillStyle = col; ctx.fillRect(-160, o, 320, 14); }); ctx.restore(); }
  if (c.apron) { ctx.fillStyle = c.apron; rr(-44, -262, 88, 132, 12); ctx.fill(); ctx.fillStyle = '#fff'; text('HOCK', 0, -220, 15, '#fff'); }
  if (id === 'teacher') { ctx.fillStyle = '#fde047'; rr(-12, -298, 24, 16, 4); ctx.fill(); }
  // arms
  const gest = st.talking && ['teach', 'excited', 'shock', 'smug', 'happy', 'thinking', 'annoyed', 'flustered', 'determined'].includes(st.mood);
  const armR = gest ? -1.1 + Math.sin(t * 3.2) * 0.35 * (0.4 + talk) : 0.12 + Math.sin(t * 1.3) * 0.03;
  const armL = st.mood === 'shock' ? -2.3 : st.mood === 'thinking' ? -2.6 : 0.12;
  const arm = (side, ang) => {
    ctx.save(); ctx.translate(side * (bw - 8), -280); ctx.rotate(side * -ang);
    ctx.fillStyle = c.top; rr(-15, -6, 30, 92, 15); ctx.fill();
    circ(0, 92, 13); fillC(c.skin); ctx.restore();
  };
  arm(-1, armL); arm(1, armR);
  // props
  if (st.prop === 'phone') { ctx.save(); ctx.translate(bw + 30, -230 - Math.sin(t*3)*4); ctx.rotate(-0.2); ctx.fillStyle = '#1f2937'; rr(-16, -28, 32, 56, 6); ctx.fill(); ctx.fillStyle = '#e0f2fe'; rr(-12, -22, 24, 40, 3); ctx.fill(); ctx.fillStyle = '#22c55e'; rr(-10, -18, 14, 7, 3); ctx.fill(); ctx.fillStyle = '#93c5fd'; rr(-4, -8, 14, 7, 3); ctx.fill(); ctx.fillStyle = '#22c55e'; rr(-10, 2, 12, 7, 3); ctx.fill(); ctx.restore(); }
  if (st.prop === 'tablet') { ctx.save(); ctx.translate(-bw - 20, -205); ctx.rotate(0.15); ctx.fillStyle = '#111827'; rr(-40, -30, 80, 60, 6); ctx.fill(); ctx.fillStyle = '#e5f9ec'; rr(-35, -25, 70, 50, 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-30, 4); ctx.lineTo(30, 4); strokeC('#1e3a8a', 3); for (const [xx, cc] of [[-22, '#dc2626'], [-4, '#16a34a'], [16, '#d97706']]) { circ(xx, 4, 4); fillC(cc); } text('TIMELINE', 0, -14, 9, '#1e3a8a'); ctx.restore(); }
  if (st.prop === 'cushion') { ctx.save(); ctx.translate(0, -215); ctx.rotate(Math.sin(t*2)*0.05); ctx.fillStyle = '#f472b6'; rr(-50, -40, 100, 80, 22); ctx.fill(); ctx.fillStyle = '#fbcfe8'; rr(-25, -20, 50, 40, 12); ctx.fill(); ctx.fillStyle = '#f472b6'; rr(-12, -10, 24, 20, 6); ctx.fill(); ctx.restore(); }
  const PX = bw + 30, PY = -230;
  if (st.prop === 'book') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(-0.15); ctx.fillStyle = '#1d4ed8'; rr(-26, -34, 52, 68, 4); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(-20, -26, 40, 6); text('HISTORY', 0, 4, 10, '#fde047'); ctx.restore(); }
  if (st.prop === 'plate') { ctx.save(); ctx.translate(PX, PY + 10); ell(0, 0, 44, 14); fillC('#f8fafc'); ell(0, -6, 30, 12); fillC('#f59e0b'); circ(-8, -10, 5); fillC('#16a34a'); circ(10, -9, 4); fillC('#dc2626'); ctx.restore(); }
  if (st.prop === 'map') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(-0.1); ctx.fillStyle = '#fef3c7'; rr(-40, -30, 80, 60, 3); ctx.fill(); ctx.beginPath(); ctx.moveTo(-30, 18); ctx.lineTo(-5, -10); ctx.lineTo(25, 8); ctx.setLineDash([5, 4]); strokeC('#dc2626', 3); ctx.setLineDash([]); text('N', 28, -18, 12, '#1e3a8a'); ctx.restore(); }
  if (st.prop === 'dice') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(Math.sin(t * 2) * 0.2); ctx.fillStyle = '#fff'; rr(-18, -18, 36, 36, 7); ctx.fill(); strokeC('#111', 2); for (const [a, b2] of [[-8, -8], [0, 0], [8, 8], [-8, 8], [8, -8]]) { circ(a, b2, 3.2); fillC('#111'); } ctx.restore(); }
  if (st.prop === 'calculator') { ctx.save(); ctx.translate(PX, PY); ctx.fillStyle = '#374151'; rr(-22, -32, 44, 64, 6); ctx.fill(); ctx.fillStyle = '#bbf7d0'; rr(-17, -27, 34, 14, 2); ctx.fill(); ctx.fillStyle = '#9ca3af'; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { rr(-16 + j * 12, -8 + i * 12, 9, 9, 2); ctx.fill(); } ctx.restore(); }
  if (st.prop === 'compass') { ctx.save(); ctx.translate(PX, PY); circ(0, 0, 24); fillC('#e5e7eb'); circ(0, 0, 20); fillC('#fff'); ctx.rotate(Math.sin(t * 1.5) * 0.3); ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(5, 0); ctx.lineTo(-5, 0); ctx.fillStyle = '#dc2626'; ctx.fill(); ctx.beginPath(); ctx.moveTo(0, 17); ctx.lineTo(5, 0); ctx.lineTo(-5, 0); ctx.fillStyle = '#1f2937'; ctx.fill(); ctx.restore(); }
  if (st.prop === 'paintroller') { ctx.save(); ctx.translate(PX, PY - 20); ctx.rotate(-0.4 + Math.sin(t * 4) * 0.15); ctx.fillStyle = '#78716c'; ctx.fillRect(-3, 0, 6, 60); ctx.fillStyle = '#a78bfa'; rr(-30, -18, 60, 22, 8); ctx.fill(); ctx.restore(); }
  drawProp(st.prop, PX, PY, t, bw);
  // neck + head
  ctx.fillStyle = c.skin; rr(-14, -318, 28, 30, 8); ctx.fill();
  const hx = 0, hy = -372, hr = 58;
  // hair back
  if (c.hairStyle === 'pony') { ctx.save(); ctx.translate(hx + 46, hy - 30); ctx.rotate(0.5 + Math.sin(t * 2.2) * 0.12); ctx.fillStyle = c.hair; ell(18, 32, 18, 46, 0.2); ctx.fill(); ctx.restore(); ctx.fillStyle = '#f472b6'; circ(hx + 50, hy - 34, 7); ctx.fill(); }
  if (c.hairStyle === 'bun') { circ(hx, hy - 62, 26); fillC(c.hair); }
  if (c.hairStyle === 'bob') { ctx.fillStyle = c.hair; rr(hx - hr - 8, hy - 30, 2 * hr + 16, 78, 26); ctx.fill(); }
  if (c.hairStyle === 'mumlong') {}
  circ(hx, hy, hr); fillC(c.skin);
  // ears
  ell(hx - hr + 2, hy + 4, 9, 13); fillC(c.skin); ell(hx + hr - 2, hy + 4, 9, 13); fillC(c.skin);
  if (c.earrings) { circ(hx - hr + 2, hy + 22, 5); fillC('#facc15'); circ(hx + hr - 2, hy + 22, 5); fillC('#facc15'); }
  // hair front
  ctx.fillStyle = c.hair;
  if (c.hairStyle === 'cap') { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(hx, hy - 8, hr + 2, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); rr(hx - 10, hy - 30, 90, 14, 7); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.arc(hx, hy - 4, hr + 3, Math.PI * 1.0, Math.PI * 2.0); ctx.fill();
    if (c.hairStyle === 'short') { ctx.fillStyle = '#9ca3af'; ell(hx - hr + 6, hy - 6, 7, 16); ctx.fill(); ell(hx + hr - 6, hy - 6, 7, 16); ctx.fill(); }
    if (c.hairStyle === 'pony' || c.hairStyle === 'bun' || c.hairStyle === 'bob') { ctx.fillStyle = c.hair; ctx.beginPath(); ctx.moveTo(hx - hr - 2, hy); ctx.quadraticCurveTo(hx - 20, hy - 70, hx + 30, hy - 40); ctx.quadraticCurveTo(hx + 10, hy - 30, hx - hr + 10, hy + 10); ctx.fill(); }
  }
  // face
  drawFace(hx, hy + 8, st, c);
  drawHeadwear(st.wear, hx, hy, hr, t);
  ctx.restore();
}

function drawFace(fx, fy, st, c) {
  const mood = st.mood || 'neutral', t = st.t;
  const look = clamp(st.look || 0, -1, 1);
  const blink = blinkAt(t, st.seed);
  const ex = 21, ey = -10;
  for (const side of [-1, 1]) {
    const x = fx + side * ex, y = fy + ey;
    if (blink) { ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); strokeC('#1f1a17', 3); }
    else {
      const open = mood === 'deadpan' || mood === 'bored' ? 0.55 : mood === 'shock' ? 1.25 : 1;
      ell(x, y, 10, 11 * open); fillC('#fff');
      const py = mood === 'eyeroll' ? -6 : mood === 'thinking' ? -4 : 0;
      circ(x + look * 4, y + py + (open < 1 ? 2 : 0), 5.5); fillC('#1f1a17');
      if (open < 1) { ctx.fillStyle = c.skin || '#8b5cf6'; ctx.fillRect(x - 11, y - 12, 22, 7); }
    }
    // brows
    const [bi, bo] = brows(mood);
    ctx.beginPath(); ctx.moveTo(x - side * 3 - side * 8 + side * 0, y - 18 + bo * (side === -1 ? 1 : 0) + bi * (side === 1 ? 1 : 0));
    const inner = [x - side * 10, y - 18 + bi], outer = [x + side * 11, y - 18 + bo];
    ctx.beginPath(); ctx.moveTo(inner[0], inner[1]); ctx.lineTo(outer[0], outer[1]); ctx.lineCap = 'round'; strokeC('#1f1a17', 4.5);
  }
  if (c.glasses === 'round') { for (const s of [-1, 1]) { circ(fx + s * ex, fy + ey, 15); strokeC('#2d1b4e', 3); } ctx.beginPath(); ctx.moveTo(fx - 6, fy + ey); ctx.lineTo(fx + 6, fy + ey); strokeC('#2d1b4e', 3); }
  if (c.glasses === 'rect') { for (const s of [-1, 1]) { rr(fx + s * ex - 15, fy + ey - 11, 30, 22, 5); strokeC('#111', 3); } ctx.beginPath(); ctx.moveTo(fx - 6, fy + ey); ctx.lineTo(fx + 6, fy + ey); strokeC('#111', 3); }
  // nose
  ctx.beginPath(); ctx.moveTo(fx, fy - 2); ctx.quadraticCurveTo(fx + 6, fy + 10, fx - 1, fy + 12); strokeC('rgba(0,0,0,0.25)', 3);
  if (c.mo) { ctx.fillStyle = '#2a211d'; ctx.beginPath(); ctx.ellipse(fx, fy + 19, 18, 6, 0, Math.PI, 0); ctx.fill(); }
  // mouth
  const my = fy + 28, m = st.mouth || 0;
  if (m > 0.05) {
    const w = 15 + m * 4, h = 3 + m * 15;
    ell(fx, my + h / 3, w, h); fillC('#5a1f22');
    ctx.save(); ell(fx, my + h / 3, w, h); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(fx - w, my + h / 3 - h, w * 2, 4); ell(fx, my + h / 3 + h, w * 0.7, h * 0.6); fillC('#e66b7a'); ctx.restore();
  } else {
    ctx.beginPath();
    if (['happy', 'excited', 'smug'].includes(mood)) { ctx.moveTo(fx - 16, my); ctx.quadraticCurveTo(fx + (mood === 'smug' ? 6 : 0), my + 14, fx + 16, my - (mood === 'smug' ? 6 : 0)); }
    else if (['sad', 'worried', 'annoyed'].includes(mood)) { ctx.moveTo(fx - 13, my + 6); ctx.quadraticCurveTo(fx, my - 4, fx + 13, my + 6); }
    else if (mood === 'flustered') { ctx.moveTo(fx - 14, my + 3); for (let i = 1; i <= 4; i++) ctx.lineTo(fx - 14 + i * 7, my + 3 + (i % 2 ? -4 : 3)); }
    else if (mood === 'solemn') { ctx.moveTo(fx - 10, my + 4); ctx.quadraticCurveTo(fx, my + 1, fx + 10, my + 4); }
    else if (mood === 'shock') { ell(fx, my + 4, 8, 11); fillC('#5a1f22'); ctx.beginPath(); }
    else { ctx.moveTo(fx - 12, my + 2); ctx.lineTo(fx + 12, my + 2); }
    ctx.lineCap = 'round'; strokeC('#4a1d1d', 4);
  }
  if (mood === 'flustered') { ell(fx - 34, fy + 12, 11, 6); fillC('rgba(244,63,94,0.35)'); ell(fx + 34, fy + 12, 11, 6); fillC('rgba(244,63,94,0.35)');
    sweat(fx + 52, fy - 36 + ((t * 40) % 24), 1); }
}
function sweat(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); ctx.moveTo(0, -12); ctx.quadraticCurveTo(9, 2, 0, 8); ctx.quadraticCurveTo(-9, 2, 0, -12); ctx.fillStyle = '#7dd3fc'; ctx.fill(); strokeC('#0369a1', 1.5); ctx.restore(); }

// ---------- hand props (drawn at the character's right hand; body-local coords) ----------
function crownShape(w, h, gold = '#facc15') {
  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -h * 0.75); ctx.lineTo(-w / 4, -h * 0.35); ctx.lineTo(0, -h); ctx.lineTo(w / 4, -h * 0.35); ctx.lineTo(w / 2, -h * 0.75); ctx.lineTo(w / 2, 0); ctx.closePath();
  ctx.fillStyle = gold; ctx.fill(); ctx.lineJoin = 'round'; strokeC('#a16207', 3);
  for (const [xx, cc] of [[-w / 4, '#dc2626'], [0, '#2563eb'], [w / 4, '#16a34a']]) { circ(xx, -h * 0.18, Math.max(3, w * 0.06)); fillC(cc); }
  for (const xx of [-w / 2, 0, w / 2]) { circ(xx, xx === 0 ? -h : -h * 0.75, Math.max(3, w * 0.05)); fillC('#fef08a'); }
}
function drawProp(prop, PX, PY, t, bw) {
  if (!prop) return;
  const [kind, ptxt] = prop.split(':');
  if (kind === 'remote') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(-0.25 + Math.sin(t * 2.5) * 0.08); ctx.fillStyle = '#1f2937'; rr(-13, -40, 26, 80, 9); ctx.fill(); strokeC('#4b5563', 2);
    circ(0, -28, 6); fillC('#ef4444'); ctx.fillStyle = '#9ca3af'; for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { rr(-9 + j * 11, -14 + i * 11, 7, 7, 2); ctx.fill(); }
    ctx.fillStyle = '#60a5fa'; rr(-9, 20, 18, 10, 3); ctx.fill(); ctx.restore(); }
  if (kind === 'crown') { ctx.save(); ctx.translate(PX, PY + 20); ctx.rotate(-0.1 + Math.sin(t * 2) * 0.05); crownShape(70, 50); ctx.restore(); }
  if (kind === 'scroll') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(-0.08); ctx.fillStyle = '#fef3c7'; ctx.fillRect(-32, -40, 64, 80); ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2; ctx.strokeRect(-32, -40, 64, 80);
    ctx.fillStyle = '#a16207'; for (let i = 0; i < 6; i++) ctx.fillRect(-24, -28 + i * 10, i === 5 ? 26 : 48, 3); circ(14, 30, 7); fillC('#dc2626');
    for (const yy of [-42, 42]) { ctx.fillStyle = '#92400e'; rr(-38, yy - 6, 76, 12, 6); ctx.fill(); } ctx.restore(); }
  if (kind === 'quill') { ctx.save(); ctx.translate(PX, PY); ctx.rotate(0.5 + Math.sin(t * 3) * 0.1); ctx.beginPath(); ctx.moveTo(0, 40); ctx.quadraticCurveTo(-22, -10, 0, -55); ctx.quadraticCurveTo(14, -10, 0, 40); ctx.fillStyle = '#f8fafc'; ctx.fill(); strokeC('#94a3b8', 2);
    ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(0, -45); strokeC('#64748b', 2); ctx.beginPath(); ctx.moveTo(-2, 40); ctx.lineTo(0, 52); ctx.lineTo(2, 40); ctx.fillStyle = '#111'; ctx.fill(); ctx.restore(); }
  if (kind === 'ballot') { ctx.save(); ctx.translate(0, -205); ctx.fillStyle = '#1d4ed8'; rr(-48, -38, 96, 76, 6); ctx.fill(); ctx.fillStyle = '#fff'; rr(-44, -2, 88, 22, 3); ctx.fill(); text('VOTE', 0, 9, 16, '#1d4ed8');

      for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; circ(c.x + Math.cos(a) * 130 * k, GROUND - 160 + Math.sin(a) * 110 * k, 50 * (1 - k) + 10); fillC(sandy ? `rgba(243,205,141,${0.9 * (1 - k)})` : `rgba(237,233,254,${0.9 * (1 - k)})`); }
      if (sandy) for (let i = 0; i < 30; i++) { const a = hash(i) * Math.PI * 2, r = (60 + hash(i + 3) * 180) * k; circ(c.x + Math.cos(a) * r, GROUND - 160 + Math.sin(a) * r * 0.8, 3); fillC(`rgba(201,139,60,${1 - k})`); } }
  }
  ctx.restore();
}

function findSeg(t) { const S = TL.segments; let lo = 0, hi = S.length - 1; if (t < S[0].t0) return S[0]; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S[m].t0 <= t) lo = m; else hi = m - 1; } return S[lo]; }
function boardSide(seg) { const sp = seg.kind === 'line' ? speakerAt(seg) : null; if (seg.scene && seg.scene.startsWith('confess')) return 'right'; if (!sp) return 'right'; return sp.x < 640 ? 'right' : 'left'; }

const SHOW_CAPS = 'WHO RULES THE REMOTE?';
function remoteIcon(x, y, sc) { ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); rr(-8, -24, 16, 48, 6); ctx.fill(); ctx.restore(); }
function drawTitle(seg, t) {
  const k = t - seg.t0;
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#3b0764'); g.addColorStop(0.55, '#7e22ce'); g.addColorStop(1, '#be123c'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 34; i++) { const x = (hash(i) * W + k * 40 * (hash(i + 1) + 0.3)) % W, y = hash(i + 2) * H, sc = 0.5 + hash(i + 3) * 0.6;
    ctx.save(); ctx.globalAlpha = 0.16; ctx.translate(x, y); ctx.rotate(Math.sin(k + i) * 0.3);
    if (i % 3 === 0) crownShape(46 * sc, 30 * sc, '#fff'); else if (i % 3 === 1) { ctx.fillStyle = '#fff'; remoteIcon(0, 0, sc); } else text(['1066', '1215', '1789', '1918'][i % 4], 0, 0, 26 * sc + 8, '#fff');
    ctx.restore(); }
  const L1 = 'WHO RULES', L2 = 'THE REMOTE?';
  [[L1, 165, 0], [L2, 272, L1.length]].forEach(([word, yy, off]) => {
    ctx.font = '700 100px Fredoka'; const tw = ctx.measureText(word).width; let x = 640 - tw / 2;
    for (let i = 0; i < word.length; i++) { const ch = word[i]; const cw = ctx.measureText(ch).width; const kk = back((k - 0.1 - (i + off) * 0.045) / 0.4);
      if (kk > 0) { ctx.save(); ctx.translate(x + cw / 2, yy); ctx.scale(kk, kk); ctx.rotate(Math.sin(k * 3 + i + off) * 0.04); text(ch, 0, 0, 100, word === L2 && i >= 4 && i <= 9 ? '#fde047' : '#fff', { stroke: '#2e1065', sw: 14 }); ctx.restore(); }
      x += cw; } });
  const ck = back((k - 0.9) / 0.4); if (ck > 0) { ctx.save(); ctx.translate(1052, 108); ctx.rotate(0.25); ctx.scale(ck, ck); crownShape(84, 54); ctx.restore(); }
  const sk = ease((k - 1.2) / 0.5); ctx.globalAlpha = sk; text(seg.sub, 640, 352, 34, '#fff', { stroke: '#2e1065', sw: 7 }); ctx.globalAlpha = 1;
  const ids = ['dad', 'mum', 'tara', 'ticktock']; ids.forEach((id, i) => { const kk = back((k - 1.6 - i * 0.18) / 0.4); if (kk <= 0) return;
    ctx.save(); ctx.translate(310 + i * 220, 720); ctx.scale(0.6 * kk, 0.6 * kk); ctx.translate(-0, -GROUND - 40);
    drawChar(id, 0, { t, seed: i * 11, mood: id === 'ticktock' ? 'smug' : id === 'dad' ? 'smug' : id === 'tara' ? 'deadpan' : 'excited', look: 0, wear: id === 'dad' ? 'crown' : undefined, prop: id === 'dad' ? 'remote' : undefined }); ctx.restore(); });
}
function drawCard(seg, t) {
  const k = t - seg.t0;
  ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fde047'; ctx.fillRect(0, 300, W * ease(k / 0.4), 8);
  const kk = back(k / 0.5); ctx.save(); ctx.translate(640, 250); ctx.scale(kk, kk);
  let fs = 64; ctx.font = `700 ${fs}px Fredoka`; while (ctx.measureText(seg.text).width > 1180 && fs > 30) { fs -= 2; ctx.font = `700 ${fs}px Fredoka`; }
  text(seg.text, 0, 0, fs, '#fff'); ctx.restore();
  ctx.globalAlpha = ease((k - 0.5) / 0.4); text(seg.sub, 640, 370, 32, '#fde047', { weight: 500 }); ctx.globalAlpha = 1;
  if (seg.text === SHOW_CAPS) { ['dad', 'mum', 'tara', 'ticktock'].forEach((id, i) => { ctx.save(); ctx.translate(350 + i * 195, 720); ctx.scale(0.42, 0.42); ctx.translate(0, -GROUND - 30); drawChar(id, 0, { t, seed: i, mood: 'happy', look: 0, wear: id === 'dad' ? 'crown' : undefined }); ctx.restore(); }); }
}
function drawSolemn(seg, t) {
  const k = t - seg.t0;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b1120'); g.addColorStop(1, '#1e293b'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // a single candle
  const cx = 1110, cy = 470, fl = Math.sin(t * 9) * 1.5 + Math.sin(t * 13.7) * 1;
  const gl = ctx.createRadialGradient(cx, cy - 70, 4, cx, cy - 70, 160); gl.addColorStop(0, 'rgba(253,224,71,0.28)'); gl.addColorStop(1, 'rgba(253,224,71,0)'); ctx.fillStyle = gl; ctx.fillRect(cx - 170, cy - 240, 340, 340);
  ctx.fillStyle = '#f5f0e1'; rr(cx - 22, cy - 40, 44, 150, 6); ctx.fill(); ctx.beginPath(); ctx.moveTo(cx, cy - 40); ctx.lineTo(cx, cy - 52); strokeC('#1f2937', 3);
  ctx.beginPath(); ctx.moveTo(cx, cy - 100 + fl); ctx.quadraticCurveTo(cx + 14, cy - 64, cx, cy - 50); ctx.quadraticCurveTo(cx - 14, cy - 64, cx, cy - 100 + fl); fillC('#fbbf24'); ell(cx, cy - 62, 5, 9); fillC('#fff7ed');
  const a0 = ease(k / 0.8); ctx.globalAlpha = a0;
  text(seg.title, 120, 130, 46, '#f8fafc', { align: 'left', weight: 600 });
  ctx.fillStyle = '#d4a017'; ctx.fillRect(120, 170, 360 * a0, 3);
  (seg.lines || []).forEach((ln, i) => { const kk = ease((k - 0.6 - i * 0.6) / 0.6); if (kk <= 0) return; ctx.globalAlpha = kk;
    wrap(ln, 860, 30, 'Fredoka', 500).slice(0, 2).forEach((l2, j) => text(l2, 120, 232 + i * 64 + j * 32, 30, '#e2e8f0', { align: 'left', weight: 500 })); });
  ctx.globalAlpha = 1;
  if (seg.subs && seg.subs.length) drawSubs(seg, t);
  if (k < 0.4) { ctx.fillStyle = `rgba(0,0,0,${1 - k / 0.4})`; ctx.fillRect(0, 0, W, H); }
}
function drawChallenge(seg, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1e1b4b'); g.addColorStop(1, '#312e81'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  text(`PAUSE CHALLENGE  #${seg.n}`, 640, 70, 40, '#fde047');
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(80, 120, 1120, 190, 20); ctx.fill();
  wrap(seg.q, 1040, 46, 'Fredoka', 700).forEach((ln, i, arr) => text(ln, 640, 215 - (arr.length - 1) * 28 + i * 56, 46, '#fff'));
  const st = { t, seed: 5, mood: seg.phase === 'a' ? 'smug' : 'bored', look: -0.5 };
  if (seg.phase !== 'count') { const i = Math.floor((t - seg.say0) * TL.fps); st.talking = true; st.mouth = i >= 0 && i < seg.env.length ? seg.env[i] : 0; }
  ctx.save(); ctx.translate(1110, 720); ctx.scale(0.62, 0.62); ctx.translate(0, -GROUND); drawTicktock(0, st); ctx.restore();
  if (seg.phase === 'count') {
    const k = t - seg.t0, n = Math.max(1, 5 - Math.floor(k));
    ctx.beginPath(); ctx.arc(640, 470, 110, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - (k % 1))); strokeC('#fde047', 16);
    text(String(n), 640, 475, 120, '#fff'); text('pause now if you need longer!', 640, 640, 26, '#c7d2fe', { weight: 500 });
  }
  if (seg.phase === 'a') {
    const k = back((t - seg.t0) / 0.5); ctx.save(); ctx.translate(560, 430); ctx.scale(k, k);
    ctx.fillStyle = '#16a34a'; rr(-260, -70, 520, 140, 24); ctx.fill(); let fs = 84; ctx.font = `700 ${fs}px Fredoka`; while (ctx.measureText(seg.a).width > 480 && fs > 36) { fs -= 2; ctx.font = `700 ${fs}px Fredoka`; } text(seg.a, 0, 0, fs, '#fff'); ctx.restore();
    ctx.globalAlpha = ease((t - seg.t0 - 0.6) / 0.5); text(seg.work, 560, 580, 36, '#e0e7ff', { font: 'Hand', weight: 400 }); ctx.globalAlpha = 1;
  }
  if (seg.phase === 'q') text('Think…', 640, 470, 50, 'rgba(255,255,255,0.4)');
  if (seg.subs !== undefined && seg.phase !== 'count') { /* subtitles */ const s2 = Object.assign({}, seg, { subs: [{ t: seg.say0, text: seg.text }] }); drawSubsSmall(s2, t); }
}
function drawSubsSmall(seg, t) { if (t < seg.say0) return; const lines = wrap(seg.subs[0].text, 860, 24); const h = 20 + lines.length * 30, y = H - h - 14; ctx.fillStyle = 'rgba(0,0,0,0.6)'; rr(60, y, 900, h, 12); ctx.fill(); lines.forEach((l, i) => text(l, 510, y + 25 + i * 30, 24, '#fff', { weight: 500 })); }

function drawFreeze(seg, t) {
  const ref = TL.segments[seg.ref]; const k = t - seg.t0;
  ctx.save(); ctx.filter = 'grayscale(0.85) contrast(1.1)';
  drawStage(ref, seg.hold, { zoom: 1 + ease(k / 0.3) * 0.08 }); ctx.restore();
  ctx.fillStyle = 'rgba(255,240,200,0.12)'; ctx.fillRect(0, 0, W, H);
  const kk = back((k - 0.25) / 0.35); if (kk > 0) { ctx.save(); ctx.translate(640, 470); ctx.rotate(-0.06); ctx.scale(kk, kk);
    ctx.fillStyle = '#dc2626'; rr(-330, -60, 660, 120, 14); ctx.fill(); text(seg.text, 0, 4, 70, '#fff'); ctx.restore(); }
  const k2 = ease((k - 1.0) / 0.3); if (k2 > 0 && seg.narrator) { ctx.globalAlpha = k2; const nl = wrap(seg.narrator, 760, 30); ctx.fillStyle = '#111'; rr(240, 600, 800, 64, 10); ctx.fill(); text(nl[0], 640, 632, 30, '#fde047'); ctx.globalAlpha = 1; }
}

window.renderAt = function (t) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const seg = findSeg(t);
  if (seg.kind === 'title') return drawTitle(seg, t);
  if (seg.kind === 'card') return drawCard(seg, t);
  if (seg.kind === 'challenge') return drawChallenge(seg, t);
  if (seg.kind === 'freeze') return drawFreeze(seg, t);
  if (seg.kind === 'solemn') return drawSolemn(seg, t);
  if (!seg.scene) return;
  drawStage(seg, t);
  drawBoard(seg.board, t, boardSide(seg));
  if (seg.caption) { let first = seg; for (const s of TL.segments) { if (s.scene === seg.scene && s.caption === seg.caption && s.t0 <= seg.t0) { first = s; break; } } drawLowerThird(seg.caption, t - firstOf(seg).t0); }
  if (seg.kind === 'line') drawSubs(seg, t);
  // fade from black at very start
  if (t < 0.6) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (t > TL.duration - 0.6) { ctx.fillStyle = `rgba(0,0,0,${(t - TL.duration + 0.6) / 0.6})`; ctx.fillRect(0, 0, W, H); }
};
const _first = new Map();
function firstOf(seg) { const key = seg.scene + '|' + seg.caption; if (_first.has(key + seg.t0)) return _first.get(key + seg.t0);
  const S = TL.segments; let i = S.indexOf(seg); while (i > 0 && S[i - 1].scene === seg.scene && S[i - 1].caption === seg.caption) i--; _first.set(key + seg.t0, S[i]); return S[i]; }

window.init = async function (tl) { TL = tl;
  const svgs = new Set(); for (const sg of tl.segments) for (const b of sg.board || []) if (b.svg) svgs.add(b.svg);
  await Promise.all([...svgs].map(sv => new Promise(res => { const im = new Image(); im.onload = () => { SVG_IMG.set(sv, im); res(); }; im.onerror = () => { console.error('SVGFAIL ' + sv.slice(0, 80)); res(); }; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sv); }))); await document.fonts.load('700 40px Fredoka'); await document.fonts.load('400 30px Hand'); await document.fonts.ready; return true; };
window.frameJpeg = function (t, q) { window.renderAt(t); return cv.toDataURL('image/jpeg', q || 0.9); };
</script>
